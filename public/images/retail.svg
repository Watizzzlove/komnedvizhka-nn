<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="retGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2228"/>
      <stop offset="100%" stop-color="#080D10"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#retGrad)"/>
  <!-- Street Retail Storefront -->
  <rect x="120" y="160" width="560" height="260" rx="8" fill="#141E26"/>
  <!-- Vitrine windows -->
  <rect x="160" y="200" width="140" height="180" rx="4" fill="#202F3B"/>
  <rect x="170" y="210" width="120" height="160" fill="rgba(255,122,0,0.15)"/>
  <!-- Entrance door -->
  <rect x="340" y="230" width="120" height="150" rx="4" fill="#080D10"/>
  <rect x="350" y="240" width="45" height="140" fill="#202F3B"/>
  <rect x="405" y="240" width="45" height="140" fill="#202F3B"/>
  <!-- Right Vitrine -->
  <rect x="500" y="200" width="140" height="180" rx="4" fill="#202F3B"/>
  <rect x="510" y="210" width="120" height="160" fill="rgba(255,122,0,0.15)"/>
  <!-- Canopy / Signboard -->
  <rect x="140" y="165" width="520" height="25" fill="#FF7A00" rx="3"/>
  <text x="400" y="182" text-anchor="middle" fill="#080D10" font-family="sans-serif" font-weight="800" font-size="11" letter-spacing="4">PRIME STREET RETAIL • 1-ST LINE</text>
  <text x="400" y="450" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="18" letter-spacing="2">BOLSHAYA POKROVSKAYA ST.</text>
</svg>