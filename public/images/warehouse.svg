<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="whGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2630"/>
      <stop offset="100%" stop-color="#0E161C"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#whGrad)"/>
  <!-- Grid lines -->
  <path d="M0,400 L800,400 M0,440 L800,440 M0,480 L800,480" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <!-- Warehouse Structure -->
  <polygon points="100,380 100,180 400,130 700,180 700,380" fill="#141E26"/>
  <!-- Roof Accent -->
  <polygon points="100,180 400,130 700,180 700,195 400,145 100,195" fill="url(#accentGrad)"/>
  <!-- Panels -->
  <line x1="200" y1="180" x2="200" y2="380" stroke="#0E161C" stroke-width="2"/>
  <line x1="300" y1="180" x2="300" y2="380" stroke="#0E161C" stroke-width="2"/>
  <line x1="400" y1="145" x2="400" y2="380" stroke="#0E161C" stroke-width="2"/>
  <line x1="500" y1="180" x2="500" y2="380" stroke="#0E161C" stroke-width="2"/>
  <line x1="600" y1="180" x2="600" y2="380" stroke="#0E161C" stroke-width="2"/>
  <!-- Loading Docks (Ramps) -->
  <rect x="140" y="270" width="80" height="110" rx="4" fill="#080D10"/>
  <rect x="150" y="280" width="60" height="90" fill="#FF7A00" opacity="0.15"/>
  <rect x="260" y="270" width="80" height="110" rx="4" fill="#080D10"/>
  <rect x="270" y="280" width="60" height="90" fill="#FF7A00" opacity="0.15"/>
  <rect x="460" y="270" width="80" height="110" rx="4" fill="#080D10"/>
  <rect x="580" y="270" width="80" height="110" rx="4" fill="#080D10"/>
  <!-- Ramp platform -->
  <rect x="80" y="375" width="640" height="15" fill="#243340"/>
  <polygon points="80,390 140,430 660,430 720,390" fill="#18232B"/>
  <text x="140" y="100" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="22" letter-spacing="2">LOGISTICS TERMINAL A-CLASS</text>
  <text x="140" y="125" fill="#FF7A00" font-family="sans-serif" font-weight="600" font-size="12" letter-spacing="4">NIZHNY NOVGOROD • 12 500 M²</text>
</svg>